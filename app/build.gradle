plugins {
    id 'com.android.application'
}

// данные для подписи берём из keystore.properties (файл не в репозитории)
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.slimhome.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.slimhome.launcher'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '2.4'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}