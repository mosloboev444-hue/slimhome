plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slimhome.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.slimhome.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
